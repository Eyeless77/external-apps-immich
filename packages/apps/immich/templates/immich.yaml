{{- $ns := index .Values "_namespace" | default dict }}
{{- $tenantHost := index $ns "host" | default "" }}
{{- $tenantIngress := index $ns "ingress" | default .Release.Namespace }}
{{- $defaultHost := "" }}
{{- if $tenantHost }}
{{- $defaultHost = printf "%s.%s" .Release.Name $tenantHost }}
{{- end }}
{{- $inputHost := .Values.host | default "" }}
{{- $ingressHost := $defaultHost }}
{{- if $inputHost }}
  {{- if and $tenantHost (not (contains "." $inputHost)) }}
    {{- $ingressHost = printf "%s.%s" $inputHost $tenantHost }}
  {{- else }}
    {{- $ingressHost = $inputHost }}
  {{- end }}
{{- end }}
{{- $ingressClass := .Values.ingressClass | default $tenantIngress }}
{{- $cluster := index .Values "_cluster" | default dict }}
{{- $solver := index $cluster "solver" | default "http01" }}
{{- $clusterIssuer := index $cluster "issuer-name" | default "letsencrypt-prod" }}
{{- $defaultIngressAnnotations := dict "nginx.ingress.kubernetes.io/ssl-redirect" "true" "cert-manager.io/cluster-issuer" $clusterIssuer }}
{{- if eq $solver "http01" }}
  {{- $_ := set $defaultIngressAnnotations "acme.cert-manager.io/http01-ingress-ingressclassname" $ingressClass }}
{{- end }}
{{- $ingressTlsEnabled := .Values.ingressTls | default true }}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-system
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      version: 0.11.1
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: external-immich
  dependsOn:
    - name: postgres-{{ .Release.Name }}-db
      namespace: {{ .Release.Namespace }}
    - name: redis-{{ .Release.Name }}-redis
      namespace: {{ .Release.Namespace }}
  values:
    valkey:
      enabled: false
    immich:
      persistence:
        library:
          existingClaim: {{ printf "%s-library" .Release.Name }}
    server:
      ingress:
        main:
          enabled: {{ ne $ingressHost "" }}
          className: {{ $ingressClass | quote }}
          annotations:
{{ toYaml $defaultIngressAnnotations | indent 12 }}
          hosts:
            - host: {{ $ingressHost | quote }}
              paths:
                - path: /
                  service:
                    identifier: main
          tls:
            {{- if and $ingressTlsEnabled (ne $ingressHost "") }}
            - secretName: {{ printf "%s-tls" .Release.Name }}
              hosts:
                - {{ $ingressHost | quote }}
            {{- else }}
            []
            {{- end }}
    controllers:
      main:
        initContainers:
          init-pgvector:
            image:
              repository: docker.io/library/postgres
              tag: "17"
              pullPolicy: IfNotPresent
            env:
              PGHOST: postgres-{{ .Release.Name }}-db-rw
              PGPORT: 5432
              PGDATABASE: {{ .Values.database.name | quote }}
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: postgres-{{ .Release.Name }}-db-superuser
                    key: username
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-{{ .Release.Name }}-db-superuser
                    key: password
            command:
              - /bin/sh
              - -ec
              - |
                until psql -v ON_ERROR_STOP=1 <<'SQL'
                CREATE EXTENSION IF NOT EXISTS vector CASCADE;
                CREATE EXTENSION IF NOT EXISTS cube CASCADE;
                CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
                SQL
                do
                  echo "waiting for postgres superuser access..."
                  sleep 5
                done
        containers:
          main:
            {{- with .Values.image.serverTag }}
            image:
              tag: {{ . | quote }}
            {{- end }}
            env:
              DB_HOSTNAME: postgres-{{ .Release.Name }}-db-rw
              DB_PORT: 5432
              DB_USERNAME: {{ .Values.database.user }}
              DB_DATABASE_NAME: {{ .Values.database.name }}
              REDIS_HOSTNAME: rfrm-redis-{{ .Release.Name }}-redis
    {{- with .Values.image.machineLearningTag }}
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                tag: {{ . | quote }}
    {{- end }}
  valuesFrom:
    - kind: Secret
      name: postgres-{{ .Release.Name }}-db-credentials
      valuesKey: {{ .Values.database.user }}
      targetPath: controllers.main.containers.main.env.DB_PASSWORD
    - kind: Secret
      name: redis-{{ .Release.Name }}-redis-auth
      valuesKey: password
      targetPath: controllers.main.containers.main.env.REDIS_PASSWORD
