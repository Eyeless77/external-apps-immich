apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pgvector-init
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-pgvector
          image: docker.io/library/postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgres-{{ .Release.Name }}-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ .Release.Name }}-db-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ .Release.Name }}-db-superuser
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              until psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector CASCADE;'; do
                echo "waiting for postgres superuser access..."
                sleep 5
              done
